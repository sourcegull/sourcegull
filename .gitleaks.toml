# Secret scanning (scripts/gitleaks.sh): gitleaks' default rules, a rule for private IPv4
# addresses (internal infrastructure), and the test fixtures and local development passwords
# that are not secrets. Machine-specific additions go in .git/info/gitleaks.toml (not committed),
# which extends this file; see scripts/gitleaks.sh.
title = "sourcegull"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private IPv4 address; use a documentation address (10.0.0.x, 192.168.1.x) instead"
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'''
keywords = ["10.", "172.", "192.168."]

[[rules.allowlists]]
description = "Example addresses and range bases used in docs and tests"
regexTarget = "match"
regexes = [
  '''^10\.0\.0\.\d{1,3}$''',
  '''^10\.1\.2\.3$''',
  '''^192\.168\.[01]\.\d{1,3}$''',
  '''^172\.16\.0\.\d{1,3}$''',
]

[[rules.allowlists]]
description = "The SSRF guard, which lists and tests the private ranges"
paths = ['''^crates/outbound-webhooks/src/guard\.rs$''']

[[allowlists]]
description = "Test keys"
paths = [
  '''^crates/codehost-github/src/testdata/app-key\.pem$''',
  '''^crates/http-api/tests/fixtures/oidc-test-key\.pem$''',
]

[[allowlists]]
description = "Fake credentials in tests, and passwords of the local development containers"
regexTarget = "secret"
regexes = [
  '''^Ym90OnJlZ2lzdHJ5LXBhc3N3b3Jk$''',
  '''^aHViOmh1Yi1wYXNz$''',
  '''^Ym90OnJlZ2lzdHJ5LXBhc3MtNzc=$''',
  '''^global-secret-[12]$''',
  '''^abcdef123456$''',
  '''^0123456789abcdef0123456789abcdef01234567$''',
  '''^Hn4t-Rb8c-Wy3j$''',
  '''^Jk5r-Tw2q-Vb7n$''',
  '''^Pq8w-Gitea-Ux3e$''',
]
