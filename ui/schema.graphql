"""
The root mutation type.
"""
type MutationRoot {
	"""
	Creates a single-use reset link for a user (site admins only).
	"""
	randomizeUserPassword(user: ID!): RandomizeUserPasswordResult!
	"""
	Sends a new verification link for an unverified user address.
	"""
	resendVerificationEmail(user: ID!, email: String!): EmptyResponse!
	"""
	Sets or revokes address verification (site admins only).
	"""
	setUserEmailVerified(user: ID!, email: String!, verified: Boolean!): EmptyResponse!
	"""
	Grants or revokes site admin (site admins only). The last site admin cannot be demoted.
	"""
	setUserIsSiteAdmin(userID: ID!, siteAdmin: Boolean!): EmptyResponse!
	"""
	Changes a user's profile (the user themself or site admins). Omitted or null fields stay
	unchanged; an empty `displayName` or `avatarURL` clears it. `username` changes need
	`viewerCanChangeUsername`.
	"""
	updateUser(user: ID!, username: String, displayName: String, avatarURL: String): User!
	"""
	Changes the signed-in user's password (built-in sign-in only). `oldPassword` is required
	when the user has a password. Ends the user's other sessions.
	"""
	updatePassword(oldPassword: String, newPassword: String!): EmptyResponse!
	"""
	Adds an unverified email to a user (the user themself or site admins) and sends a
	verification link when email is configured. The first email becomes primary.
	"""
	addUserEmail(user: ID!, email: String!): EmptyResponse!
	"""
	Removes an email from a user (the user themself or site admins). The primary email and
	the only email cannot be removed.
	"""
	removeUserEmail(user: ID!, email: String!): EmptyResponse!
	"""
	Makes a verified email the user's primary one (the user themself or site admins).
	"""
	setUserEmailPrimary(user: ID!, email: String!): EmptyResponse!
	"""
	Deactivates a user (site admins only): they cannot sign in, their sessions end and their
	access tokens and app grants are revoked. Site admins cannot deactivate themselves.
	"""
	deactivateUser(user: ID!): EmptyResponse!
	"""
	Reactivates a deactivated user (site admins only). Revoked access tokens stay revoked.
	"""
	reactivateUser(user: ID!): User!
	"""
	Approves or rejects a pending request (site admins only).
	"""
	setAccessRequestStatus(id: ID!, status: AccessRequestStatus!): AccessRequestDecision!
	"""
	Saves a new site configuration based on version `lastID` (site admins only). A secret
	left as `REDACTED` keeps its stored value. Returns whether a server restart is needed
	for the change to take effect (never, currently).
	"""
	updateSiteConfiguration(lastID: Int!, input: String!): Boolean!
	"""
	Creates an access token for `user` (yourself, or anyone as a site admin).
	"""
	createAccessToken(user: ID!, scopes: [String!]!, note: String!): CreateAccessTokenResult!
	"""
	Deletes (revokes) an access token by its node ID.
	"""
	deleteAccessToken(byID: ID!): EmptyResponse!
	"""
	Creates an organization; the creator becomes its first member.
	"""
	createOrganization(name: String!, displayName: String): Org!
	"""
	Changes the display name (`""` clears it). Members and site admins.
	"""
	updateOrganization(id: ID!, displayName: String): Org!
	"""
	Deletes an organization (soft delete; its name becomes free and pending invitations
	are revoked). Site admins only.
	"""
	deleteOrganization(organization: ID!): EmptyResponse
	"""
	Adds a user as a member right away, without an invitation. Site admins only.
	"""
	addUserToOrganization(organization: ID!, username: String!): EmptyResponse!
	"""
	Removes a member. Members (including the member themself) and site admins.
	"""
	removeUserFromOrganization(user: ID!, organization: ID!): EmptyResponse
	"""
	Invites a user by username, or anyone by email address (Sourcegull: `email`; an address
	verified by a user invites that user). Members and site admins. The result carries
	the invitation link; it is also emailed when SMTP is configured.
	"""
	inviteUserToOrganization(organization: ID!, username: String, email: String): InviteUserToOrganizationResult!
	"""
	Accepts or declines an invitation. Its recipient only.
	"""
	respondToOrganizationInvitation(organizationInvitation: ID!, responseType: OrganizationInvitationResponseType!): EmptyResponse!
	"""
	Revokes a pending invitation. Members and site admins.
	"""
	revokeOrganizationInvitation(organizationInvitation: ID!): EmptyResponse!
	"""
	Emails a pending invitation again with a new link (the old link stops working).
	Members and site admins.
	"""
	resendOrganizationInvitationNotification(organizationInvitation: ID!): EmptyResponse!
	"""
	Adds a code host connection and queues its first sync (site admins only).
	"""
	addExternalService(input: AddExternalServiceInput!): ExternalService!
	"""
	Updates a code host connection (site admins only). A configuration change queues a
	full sync.
	"""
	updateExternalService(input: UpdateExternalServiceInput!): ExternalService!
	"""
	Deletes a code host connection; repos no other connection mirrors are removed (site
	admins only). `async` is accepted for compatibility; deletion is always immediate.
	"""
	deleteExternalService(externalService: ID!, async: Boolean): EmptyResponse!
	"""
	Queues a sync of a code host connection now (site admins only). No-op when one is
	already queued.
	"""
	syncExternalService(id: ID!): EmptyResponse!
	"""
	Cancels a queued or running sync job (site admins only). A running sync stops at its
	worker's next heartbeat.
	"""
	cancelExternalServiceSync(id: ID!): EmptyResponse!
	"""
	Replaces the connection's webhook secrets with a new random secret and returns it with
	the connection (site admins only). This is the only time the secret is returned;
	configure it on the code host's webhook. Webhooks sent with the old secret are rejected
	from now on.
	A connection that registers its webhooks (`webhooks.autoRegister`) gets a full sync,
	which updates the registered hooks to the new secret.
	"""
	regenerateExternalServiceWebhookSecret(id: ID!): RegenerateExternalServiceWebhookSecretPayload!
	"""
	Asks the repo node to fetch the repository now (site admins only).
	"""
	updateMirrorRepository(repository: ID!): EmptyResponse!
	"""
	Adds a key-value pair to a repository; a null value makes the key a tag.
	"""
	addRepoKeyValuePair(repo: ID!, key: String!, value: String): EmptyResponse!
	"""
	Replaces the value of a repository's key; a null value makes the key a tag.
	"""
	updateRepoKeyValuePair(repo: ID!, key: String!, value: String): EmptyResponse!
	"""
	Deletes a key-value pair from a repository.
	"""
	deleteRepoKeyValuePair(repo: ID!, key: String!): EmptyResponse!
	"""
	Clones the repository again from its code host, replacing the copy on its repo node
	once the new clone is complete (site admins only). A repository not cloned yet is
	cloned.
	"""
	recloneRepository(repo: ID!): EmptyResponse!
	"""
	Queues the failed repository moves between repo nodes again (site admins only).
	Returns how many.
	"""
	retryFailedRepoMoves: Int!
