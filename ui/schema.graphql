"""
A user or an organization.
"""
interface Namespace {
	"""
	The opaque node ID.
	"""
	id: ID!
	"""
	The namespace's page.
	"""
	url: String!
}

"""
A page of users (an organization's members).
"""
type NewUsersConnection {
	"""
	The users on this page.
	"""
	nodes: [User!]!
	"""
	The number of users in total.
	"""
	totalCount: Int!
	"""
	Pagination.
	"""
	pageInfo: PageInfo!
}

"""
`NoRepositoriesDetected`: there are no repositories.
"""
type NoRepositoriesDetected {
	"""
	The message.
	"""
	message: String!
}

"""
An object with an opaque, globally unique ID.
"""
interface Node {
	"""
	The opaque node ID.
	"""
	id: ID!
}

type NonExhaustiveSearchAggregationResult {
	groups: [AggregationGroup!]!
	otherResultCount: Int
	approximateOtherGroupCount: Int
	supportsPersistence: Boolean
	mode: SearchAggregationMode!
}

enum NotAvailableReasonType {
	INVALID_QUERY
	INVALID_AGGREGATION_MODE_FOR_QUERY
	TIMEOUT_EXTENSION_AVAILABLE
	TIMEOUT_NO_EXTENSION_AVAILABLE
	ERROR_OCCURRED
}

type Notebook implements Node {
	"""
	The unique id of the notebook.
	"""
	id: ID!
	"""
	The title of the notebook.
	"""
	title: String!
	"""
	Array of notebook blocks. File and symbol blocks in repositories the viewer may not
	read are left out.
	"""
	blocks: [NotebookBlock!]!
	"""
	User that created the notebook or null if the user was removed.
	"""
	creator: User
	"""
	User that last updated the notebook or null if that user was removed.
	"""
	updater: User
	"""
	Notebook namespace or null if the namespace (user or org) was removed.
	"""
	namespace: Namespace
	"""
	Public notebooks are available to any user on the instance; private ones only to
	their user, or to the members of their organization.
	"""
	public: Boolean!
	"""
	Date and time the notebook was last updated.
	"""
	updatedAt: DateTime!
	"""
	Date and time the notebook was created.
	"""
	createdAt: DateTime!
	"""
	If current viewer can manage (edit, delete) the notebook.
	"""
	viewerCanManage: Boolean!
	"""
	If current viewer has starred the notebook.
	"""
	viewerHasStarred: Boolean!
	"""
	Notebook stars.
	"""
	stars(first: Int = 50, after: String): NotebookStarConnection!
	"""
	The default pattern type that is used to interpret queries that do not contain a
	patternType: filter.
	"""
	patternType: SearchPatternType!
}

"""
Notebook blocks: Markdown, query, file and symbol blocks.
"""
union NotebookBlock = MarkdownBlock | QueryBlock | FileBlock | SymbolBlock

"""
Enum of possible block types.
"""
enum NotebookBlockType {
	MARKDOWN
	QUERY
	FILE
	SYMBOL
}

"""
A paginated list of notebooks.
"""
type NotebookConnection {
	"""
	A list of notebooks.
	"""
	nodes: [Notebook!]!
	"""
	The total number of notebooks in the connection.
	"""
	totalCount: Int!
	"""
	Pagination information.
	"""
	pageInfo: PageInfo!
}

"""
Input for a new notebook.
"""
input NotebookInput {
	"""
	The title of the notebook.
	"""
	title: String!
	"""
	Array of notebook blocks.
	"""
	blocks: [CreateNotebookBlockInput!]!
	"""
	Notebook namespace (user or org). Controls the visibility of the notebook and who can
	edit the notebook.
	"""
	namespace: ID!
	"""
	Whether every user of the instance may see the notebook.
	"""
	public: Boolean!
}

type NotebookStar {
	"""
	User that starred the notebook.
	"""
	user: User!
	"""
	Date and time the notebook star was created.
	"""
	createdAt: DateTime!
}

"""
A paginated list of notebook stars.
"""
type NotebookStarConnection {
	"""
	A list of notebook stars.
	"""
	nodes: [NotebookStar!]!
	"""
	The total number of notebook stars in the connection.
	"""
	totalCount: Int!
	"""
	Pagination information.
	"""
	pageInfo: PageInfo!
}

