	applyPreview(first: Int = 50, after: String, search: String, currentState: ChangesetState, action: ChangesetSpecOperation, publicationStates: [ChangesetSpecPublicationStateInput!]): ChangesetApplyPreviewConnection!
	"""
	The creator; null once deleted.
	"""
	creator: User
	createdAt: DateTime!
