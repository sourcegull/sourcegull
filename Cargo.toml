[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/sourcegull/sourcegull"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# internal
sourcegull-types = { path = "crates/types" }
sourcegull-config = { path = "crates/config" }
sourcegull-db = { path = "crates/db" }
sourcegull-pgqueue = { path = "crates/pgqueue" }
sourcegull-leader = { path = "crates/leader" }
sourcegull-pubsub = { path = "crates/pubsub" }
sourcegull-observability = { path = "crates/observability" }
sourcegull-crypto = { path = "crates/crypto" }
sourcegull-authn = { path = "crates/authn" }
sourcegull = { path = "crates/sourcegull" }
sourcegull-graphql = { path = "crates/graphql" }
sourcegull-graphql-core = { path = "crates/graphql-core" }
sourcegull-http-api = { path = "crates/http-api" }
sourcegull-http-extract = { path = "crates/http-extract" }
sourcegull-services = { path = "crates/services" }
sourcegull-web-assets = { path = "crates/web-assets" }
sourcegull-testutil = { path = "crates/testutil" }
sourcegull-codehost = { path = "crates/codehost" }
sourcegull-codehost-gitlab = { path = "crates/codehost-gitlab" }
sourcegull-codehost-github = { path = "crates/codehost-github" }
sourcegull-codehost-gitea = { path = "crates/codehost-gitea" }
sourcegull-repos = { path = "crates/repos" }
sourcegull-declarative = { path = "crates/declarative" }
sourcegull-batches-reconciler = { path = "crates/batches-reconciler" }
sourcegull-rpc = { path = "crates/rpc" }
sourcegull-gitstore = { path = "crates/gitstore" }
sourcegull-repo-node = { path = "crates/repo-node" }
sourcegull-feature = { path = "crates/feature" }
sourcegull-languages = { path = "crates/languages" }
sourcegull-highlight = { path = "crates/highlight" }
sourcegull-symbols = { path = "crates/symbols" }
sourcegull-query = { path = "crates/query" }
sourcegull-query-wasm = { path = "crates/query-wasm" }
sourcegull-search = { path = "crates/search" }
sourcegull-search-exec = { path = "crates/search-exec" }
sourcegull-search-client = { path = "crates/search-client" }
sourcegull-search-web = { path = "crates/search-web" }
sourcegull-index-format = { path = "crates/index-format" }
sourcegull-indexer = { path = "crates/indexer" }
sourcegull-structural = { path = "crates/structural" }
sourcegull-authz = { path = "crates/authz" }
sourcegull-codenav = { path = "crates/codenav" }
sourcegull-mcp = { path = "crates/mcp" }
sourcegull-oauth-server = { path = "crates/oauth-server" }
sourcegull-codeintel-syntactic = { path = "crates/codeintel-syntactic" }
sourcegull-blobstore = { path = "crates/blobstore" }
sourcegull-codeintel-policies = { path = "crates/codeintel-policies" }
sourcegull-codeintel-scip = { path = "crates/codeintel-scip" }
sourcegull-executor-api = { path = "crates/executor-api" }
