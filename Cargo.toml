sourcegull-analytics-graphql = { path = "crates/analytics-graphql" }
sourcegull-searchjobs = { path = "crates/searchjobs" }
sourcegull-searchjobs-graphql = { path = "crates/searchjobs-graphql" }
sourcegull-compute = { path = "crates/compute" }
sourcegull-notebooks = { path = "crates/notebooks" }
sourcegull-notebooks-graphql = { path = "crates/notebooks-graphql" }
