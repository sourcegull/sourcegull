sourcegull-insights-graphql = { path = "crates/insights-graphql" }
sourcegull-batches-graphql = { path = "crates/batches-graphql" }
sourcegull-codeintel-graphql = { path = "crates/codeintel-graphql" }
sourcegull-ratelimit = { path = "crates/ratelimit" }
sourcegull-oobmigration = { path = "crates/oobmigration" }
sourcegull-monitoring = { path = "crates/monitoring" }

# external
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
jsonschema = { version = "0.30", default-features = false }
arc-swap = "1"
moka = { version = "0.12", features = ["future"] }
roaring = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "limit", "request-id", "util"] }
hyper = "1"
async-graphql = { version = "7", features = ["chrono"] }
async-graphql-axum = "7"
clap = { version = "4", features = ["derive", "env"] }
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
ipnet = "2"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
subtle = "2"
zeroize = "1"
mimalloc = "0.1"
cookie = "0.18"
rust-embed = "8"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9.3"
crc = "3"
http-body-util = "0.1"
http = "1"
url = "2"
regex = "1"
regex-syntax = "0.8"
wiremock = "0.6"
rayon = "1"
globset = "0.4"

# Panics unwind: a panicking job or search request fails alone (pgqueue records it as
# errored, the search pool returns an error) instead of taking down every role in the process.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

# The query box parser (ui/static/query.wasm): small over fast.
[profile.release.package.sourcegull-query-wasm]
opt-level = "s"

# Line tables only: backtraces keep file and line, and test binaries stay small (full debug
# info is most of a binary's size, copied into every test binary).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
