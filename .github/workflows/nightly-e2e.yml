# End-to-end checks, run by hand: the batch changes scale test, a batch change campaign on
# BATCHES_SCALE_REPOS repositories (1,000 by default) against a real GitLab CE, with Sourcegull from
# the production image built from this commit and an executor on the host's Docker
# (scripts/test/batches-scale.sh).
#
# The job builds the production image (the Rust release build is most of the first hour on a
# standard runner), starts GitLab CE (about 4-5 GB of memory), seeds the projects, runs the
# campaign and uploads .test-out/batches-scale/ (results.json, the spec, logs) as an artifact.
# Run by hand with another size: Actions → Nightly E2E → Run workflow (repos).
name: Nightly E2E

# Manual only: no push, PR or schedule triggers.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: Repositories in the campaign (BATCHES_SCALE_REPOS)
        default: "1000"
        required: true

permissions:
  contents: read

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  batches-scale:
    name: Batch changes scale test (campaign on GitLab CE)
    runs-on: [self-hosted, linux]
    timeout-minutes: 350
    env:
      BATCHES_SCALE_REPOS: ${{ inputs.repos || '1000' }}
      # The runner has 2-4 cores: fewer step containers at once than on a workstation.
      BATCHES_SCALE_EXECUTOR_JOBS: "4"
    steps:
      - uses: actions/checkout@v5

      - name: Machine
        run: |
          nproc
          free -g
          docker version --format '{{.Server.Version}}'

      - name: Toolbox image and Postgres
        run: |
          docker compose build dev
          docker compose up -d --wait postgres

      - name: Up (GitLab, image build, seed, Sourcegull, executor)
        run: scripts/test/batches-scale.sh up

      - name: Run the campaign
        run: scripts/test/batches-scale.sh run

      - name: Logs
        if: always()
        run: |
          mkdir -p .test-out/batches-scale/logs
          docker logs sourcegull-batches-scale > .test-out/batches-scale/logs/sourcegull.log 2>&1 || true
          docker logs sourcegull-batches-scale-executor > .test-out/batches-scale/logs/executor.log 2>&1 || true
          docker compose logs --no-color gitlab > .test-out/batches-scale/logs/gitlab.log 2>&1 || true
          free -g
          docker stats --no-stream || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batches-scale
          path: |
            .test-out/batches-scale/results.json
            .test-out/batches-scale/state.json
            .test-out/batches-scale/local/spec.yml
            .test-out/batches-scale/logs/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          if [ -f .test-out/batches-scale/results.json ]; then
            { echo '```'; scripts/test/batches-scale.sh summary || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
