# Release: checks the Helm chart, builds the runtime and cli images for linux/amd64, runs the
# smoke test and the Gitea browser check against the runtime image, then pushes
# ghcr.io/<owner>/sourcegull and ghcr.io/<owner>/gull with an SBOM and provenance and the chart to
# oci://ghcr.io/<owner>/charts (when its version is new), signs them by digest (keyless) and
# creates the GitHub release with the Compose bundle (sourcegull-compose.tar.gz) attached. (The
# Dockerfile also cross-compiles linux/arm64, which is not published.)
#
# Started by hand on main (Actions → Release → Run workflow): the self-hosted runner accepts
# only this repository's workflows from main, so neither tags nor other branches can run it.
# Without `publish` it builds and tests only. With it, it releases the workspace version in
# Cargo.toml (X.Y.Z, or X.Y.Z-pre for a pre-release): creates the tag vX.Y.Z on the commit,
# which must not exist yet, and pushes the images tagged X.Y.Z, X.Y and latest (pre-releases
# only X.Y.Z-pre).
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (tag, images, GitHub release); otherwise build and test only
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  # Keyless signing.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sourcegull
  CLI_IMAGE: ghcr.io/${{ github.repository_owner }}/gull
  CHARTS: ghcr.io/${{ github.repository_owner }}/charts
  PUSH: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
  # Limits sized to the runner's machine: the image builder's memory and rustc jobs, and the dev
  # containers of the Gitea check. The images are built with thin LTO and 16
  # codegen units (build-args below): fat LTO optimises the whole program on one core at every
  # build, for each platform, at a large cost in memory and time for a few percent at runtime.
  BUILD_MEMORY: 12g
  CARGO_BUILD_JOBS: "4"
  SOURCEGULL_DEV_MEMORY: 5g

jobs:
  release:
    name: build, test, publish
    runs-on: [self-hosted, linux]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          # The secret scan reads every commit.
          fetch-depth: 0
      - name: Secret scan
        run: scripts/gitleaks.sh history

      # helm lint --strict and helm template of every preset and option, values.schema.json current.
      - name: Chart check
        run: scripts/test/helm-ct.sh template

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$PUSH" = true ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released; bump the version in Cargo.toml"
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "build-args<<EOF"
            echo "VERSION=$version"
            echo "REVISION=$GITHUB_SHA"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"
            echo "CARGO_PROFILE_RELEASE_LTO=thin"
            echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
          echo "version $version (prerelease: $prerelease, push: $PUSH)"

      # A builder that stays on the runner host between runs: its state volume
      # (buildx_buildkit_sourcegull-release0_state) holds the layers and the cache mounts (cargo's
      # target/, crate sources, npm), with garbage collection per .github/buildkitd.toml. Capped so
      # a build cannot exhaust the host: an out-of-memory kill fails the build. When the limit or
      # the BuildKit config changes, only the container is recreated; the volume, and with it the
      # cache, is kept.
      - name: Builder
        id: builder
        run: |
          name=sourcegull-release
          settings=$(printf '%s\n' "$BUILD_MEMORY" | cat - .github/buildkitd.toml | sha256sum | cut -c1-16)
          current=$(docker exec "buildx_buildkit_${name}0" cat /var/lib/buildkit/sourcegull-settings 2>/dev/null || true)
          if [ "$current" != "$settings" ] || ! docker buildx inspect "$name" >/dev/null 2>&1; then
            docker buildx rm --keep-state "$name" >/dev/null 2>&1 || docker rm -f "buildx_buildkit_${name}0" >/dev/null 2>&1 || true
            docker buildx create --name "$name" --driver docker-container \
              --buildkitd-config .github/buildkitd.toml \
              --driver-opt "memory=$BUILD_MEMORY,memory-swap=$BUILD_MEMORY"
            docker buildx inspect --bootstrap "$name"
            docker exec "buildx_buildkit_${name}0" sh -c "echo $settings > /var/lib/buildkit/sourcegull-settings"
          fi
          docker buildx inspect --bootstrap "$name"
          docker buildx du --builder "$name" | tail -n 3
          echo "name=$name" >>"$GITHUB_OUTPUT"

      # Loaded for the tests below; the push reuses its layers from the builder.
      - name: Build runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: sourcegull-release:test
          build-args: ${{ steps.version.outputs.build-args }}
          builder: ${{ steps.builder.outputs.name }}

      - name: Smoke test
        run: scripts/test/release-smoke.sh sourcegull-release:test
      # Gitea connection, sign-in through Gitea and search results, in the browser.
      - name: Gitea check
        run: SOURCEGULL_E2E_IMAGE=sourcegull-release:test CHECKS=gitea scripts/dev e2e
      # Keeps the volumes (Postgres, the e2e image's caches) for the next run; the Gitea check
      # starts Gitea fresh and uses its own database.
      - name: Stop the test stack
        if: always()
        run: docker compose --profile e2e --profile gitea down --remove-orphans || true

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
      - name: CLI image tags
        id: cli-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CLI_IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push runtime
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.version.outputs.build-args }}
          builder: ${{ steps.builder.outputs.name }}
      - name: Push cli
        id: push-cli
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: cli
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.cli-meta.outputs.tags }}
          labels: ${{ steps.cli-meta.outputs.labels }}
          build-args: ${{ steps.version.outputs.build-args }}
          builder: ${{ steps.builder.outputs.name }}

      # The chart has its own version: pushed only when that version is not in the registry yet.
      - uses: azure/setup-helm@v4
        if: env.PUSH == 'true'
        with:
          version: v3.16.4
      - name: Push chart
        id: chart
        if: env.PUSH == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chart_version=$(sed -n 's/^version: //p' deploy/helm/sourcegull/Chart.yaml)
          echo "version=$chart_version" >>"$GITHUB_OUTPUT"
          printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if helm show chart "oci://$CHARTS/sourcegull" --version "$chart_version" >/dev/null 2>&1; then
            echo "chart $chart_version is already published"
            echo "pushed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          helm package deploy/helm/sourcegull -d "$RUNNER_TEMP/chart"
          helm push "$RUNNER_TEMP/chart/sourcegull-$chart_version.tgz" "oci://$CHARTS" 2>&1 | tee "$RUNNER_TEMP/chart-push.log"
          digest=$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/chart-push.log")
          echo "pushed=true" >>"$GITHUB_OUTPUT"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      # The Compose files a host needs (no Dockerfile or development files), as a release asset.
      - name: Compose bundle
        if: env.PUSH == 'true'
        run: |
          tar -czf "$RUNNER_TEMP/sourcegull-compose.tar.gz" \
            --transform 's,^deploy/docker,sourcegull-compose,' \
            deploy/docker/compose.yaml deploy/docker/.env.example deploy/docker/upgrade.md \
            deploy/docker/config deploy/docker/prometheus deploy/docker/grafana

      - uses: sigstore/cosign-installer@v3
        if: env.PUSH == 'true'
      - name: Sign
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          CLI_DIGEST: ${{ steps.push-cli.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST" "$CLI_IMAGE@$CLI_DIGEST"
          if [ -n "$CHART_DIGEST" ]; then cosign sign --yes "$CHARTS/sourcegull@$CHART_DIGEST"; fi

      - name: Release notes
        if: env.PUSH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          CLI_DIGEST: ${{ steps.push-cli.outputs.digest }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          Docker Compose: download \`sourcegull-compose.tar.gz\` below, then follow
          [docs/install.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/install.md#docker-compose).

          Kubernetes:

          \`\`\`sh
          helm install sourcegull oci://$CHARTS/sourcegull --version $CHART_VERSION
          \`\`\`

          ## Images

          | Image | Digest |
          |---|---|
          | \`$IMAGE:$VERSION\` | \`$DIGEST\` |
          | \`$CLI_IMAGE:$VERSION\` | \`$CLI_DIGEST\` |

          linux/amd64, signed with keyless cosign:

          \`\`\`sh
          cosign verify $IMAGE@$DIGEST \\
            --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
      - uses: softprops/action-gh-release@v2
        if: env.PUSH == 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: ${{ runner.temp }}/notes.md
          append_body: true
          generate_release_notes: true
          files: ${{ runner.temp }}/sourcegull-compose.tar.gz
