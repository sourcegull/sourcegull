# Release: builds the runtime and cli images for linux/amd64, runs the smoke test and the Gitea
# browser check against the runtime image, then pushes ghcr.io/<owner>/sourcegull and
# ghcr.io/<owner>/gull with an SBOM and provenance, signs them by digest (keyless) and creates the
# GitHub release. (The Dockerfile also cross-compiles linux/arm64, which is not published.)
#
# Started by hand on main (Actions → Release → Run workflow): the self-hosted runner accepts
# only this repository's workflows from main, so neither tags nor other branches can run it.
# Without `publish` it builds and tests only. With it, it releases the workspace version in
# Cargo.toml (X.Y.Z, or X.Y.Z-pre for a pre-release): creates the tag vX.Y.Z on the commit,
# which must not exist yet, and pushes the images tagged X.Y.Z, X.Y and latest (pre-releases
# only X.Y.Z-pre).
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (tag, images, GitHub release); otherwise build and test only
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  # Keyless signing.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sourcegull
  CLI_IMAGE: ghcr.io/${{ github.repository_owner }}/gull
  PUSH: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
  # Limits sized to the runner's machine: the image builder's memory and rustc jobs, and the dev
  # containers of the Gitea check. The images are built with thin LTO and 16
  # codegen units (build-args below): fat LTO optimises the whole program on one core at every
  # build, for each platform, at a large cost in memory and time for a few percent at runtime.
  BUILD_MEMORY: 12g
  CARGO_BUILD_JOBS: "4"
  SOURCEGULL_DEV_MEMORY: 5g

jobs:
  release:
    name: build, test, publish
    runs-on: [self-hosted, linux]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          # The secret scan reads every commit.
          fetch-depth: 0
      - name: Secret scan
        run: scripts/gitleaks.sh history

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$PUSH" = true ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released; bump the version in Cargo.toml"
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "build-args<<EOF"
            echo "VERSION=$version"
            echo "REVISION=$GITHUB_SHA"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"
            echo "CARGO_PROFILE_RELEASE_LTO=thin"
            echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
          echo "version $version (prerelease: $prerelease, push: $PUSH)"

      # A builder that stays on the runner host between runs (its state volume keeps the layer
      # and cargo caches), capped so a build cannot exhaust the host: an out-of-memory kill fails
      # the build. Recreated over the same state when the runner lost its buildx config.
      - name: Builder
        id: builder
        run: |
          # Named after the limit, so a new limit gets a new builder.
          name=sourcegull-release-$BUILD_MEMORY
          if ! docker buildx inspect "$name" >/dev/null 2>&1; then
            docker rm -f "buildx_buildkit_${name}0" >/dev/null 2>&1 || true
            docker buildx create --name "$name" --driver docker-container \
              --driver-opt "memory=$BUILD_MEMORY,memory-swap=$BUILD_MEMORY"
          fi
          docker buildx inspect --bootstrap "$name"
          echo "name=$name" >>"$GITHUB_OUTPUT"

      # Loaded for the tests below; the push reuses its layers from the builder.
      - name: Build runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: sourcegull-release:test
          build-args: ${{ steps.version.outputs.build-args }}
          builder: ${{ steps.builder.outputs.name }}

      - name: Smoke test
        run: scripts/test/release-smoke.sh sourcegull-release:test
      # Gitea connection, sign-in through Gitea and search results, in the browser.
      - name: Gitea check
        run: SOURCEGULL_E2E_IMAGE=sourcegull-release:test CHECKS=gitea scripts/dev e2e
      # Keeps the volumes (Postgres, the e2e image's caches) for the next run; the Gitea check
      # starts Gitea fresh and uses its own database.
      - name: Stop the test stack
        if: always()
        run: docker compose --profile e2e --profile gitea down --remove-orphans || true

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
      - name: CLI image tags
        id: cli-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CLI_IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push runtime
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.version.outputs.build-args }}
          builder: ${{ steps.builder.outputs.name }}
      - name: Push cli
        id: push-cli
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: cli
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.cli-meta.outputs.tags }}
          labels: ${{ steps.cli-meta.outputs.labels }}
          build-args: ${{ steps.version.outputs.build-args }}
          builder: ${{ steps.builder.outputs.name }}

      - uses: sigstore/cosign-installer@v3
        if: env.PUSH == 'true'
      - name: Sign
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          CLI_DIGEST: ${{ steps.push-cli.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST" "$CLI_IMAGE@$CLI_DIGEST"

      - name: Release notes
        if: env.PUSH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          CLI_DIGEST: ${{ steps.push-cli.outputs.digest }}
        run: |
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          ## Images

          | Image | Digest |
          |---|---|
          | \`$IMAGE:$VERSION\` | \`$DIGEST\` |
          | \`$CLI_IMAGE:$VERSION\` | \`$CLI_DIGEST\` |

          linux/amd64, signed with keyless cosign:

          \`\`\`sh
          cosign verify $IMAGE@$DIGEST \\
            --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
      - uses: softprops/action-gh-release@v2
        if: env.PUSH == 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: ${{ runner.temp }}/notes.md
          append_body: true
          generate_release_notes: true
