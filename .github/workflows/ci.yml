# CI: one job runs rustfmt, clippy and the tests against Postgres. cargo-deny, Helm lint and the Docker image build run only when
# the workflow is started by hand (Actions → CI → Run workflow). Chart tests on kind: helm.yml.
name: CI

# Manual only: no push, PR or schedule triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short
  # Debug info for every test binary filled the runner's disk at link time.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sourcegull
          POSTGRES_PASSWORD: sourcegull
          POSTGRES_DB: sourcegull
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sourcegull -d sourcegull"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SOURCEGULL_TEST_DATABASE_URL: postgres://sourcegull:sourcegull@localhost:5432/sourcegull
      SOURCEGULL_REQUIRE_TEST_DATABASE: "1"
    steps:
      # The workspace's test binaries and Postgres outgrew the runner's free disk (~14 GB).
      # Drop preinstalled SDKs this job never uses (~25 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Includes the insights backfill property tests (crates/insights/tests/backfill_props.rs):
      # a fixed 40 generated cases per run plus the saved regression seeds.
      - run: cargo test --workspace --locked
      # The search benchmark end to end on the tiny corpus (docs/development.md):
      # corpus generation and checksum, indexing, and the SSE runner, with a few samples.
      - name: Search benchmark (tiny corpus)
        env:
          SOURCEGULL_DATABASE_URL: postgres://sourcegull:sourcegull@localhost:5432/sourcegull
          SOURCEGULL_CORPUS_DIR: ${{ runner.temp }}/corpora
        run: scripts/bench/search.sh --corpus tiny --repeats 3 --warmups 1
      # promtool and helm on the generated monitoring files, in Docker.
      - run: scripts/test/check-monitoring.sh

  # Manual only (workflow_dispatch).
  extra:
    name: cargo-deny, helm lint, docker build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # helm lint/template of every preset and option (ct install runs in helm.yml).
      - name: Helm lint
        run: scripts/test/helm-ct.sh template
      - uses: docker/setup-buildx-action@v3
      - name: Build sourcegull image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: sourcegull/sourcegull:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=sourcegull
          cache-to: type=gha,scope=sourcegull,mode=max
