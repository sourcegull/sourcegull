sourcegull-db = { workspace = true }
sourcegull-graphql-core = { workspace = true }
sourcegull-executors-graphql = { workspace = true }
sourcegull-highlight = { workspace = true }
axum = { workspace = true }
sourcegull-http-extract = { workspace = true }
sourcegull-search-web = { workspace = true }
sourcegull-services = { workspace = true }
sourcegull-languages = { workspace = true }
