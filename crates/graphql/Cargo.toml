[package]
name = "sourcegull-graphql"
description = "The GraphQL API at /.api/graphql, split per domain module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

