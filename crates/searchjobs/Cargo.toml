[package]
name = "sourcegull-searchjobs"
description = "Search Jobs: exhaustive searches split into repository and revision jobs, results in the blob store as JSONL, downloads as JSONL or CSV."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sourcegull-feature = { workspace = true }
anyhow = { workspace = true }
sourcegull-authn = { workspace = true }
sourcegull-authz = { workspace = true }
sourcegull-blobstore = { workspace = true }
sourcegull-config = { workspace = true }
sourcegull-db = { workspace = true }
axum = { workspace = true }
sourcegull-http-extract = { workspace = true }
sourcegull-search-web = { workspace = true }
sourcegull-services = { workspace = true }
sourcegull-pgqueue = { workspace = true }
sourcegull-query = { workspace = true }
sourcegull-rpc = { workspace = true }
sourcegull-search = { workspace = true }
sourcegull-types = { workspace = true, features = ["sqlx"] }
async-trait = { workspace = true }
bytes = "1"
chrono = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sourcegull-http-api = { workspace = true }
reqwest = { workspace = true }
sourcegull = { workspace = true }
sourcegull-graphql = { workspace = true }
sourcegull-observability = { workspace = true }
sourcegull-testutil = { workspace = true, features = ["git"] }
tempfile = "3"
