sourcegull-outbound-webhooks = { workspace = true }
sourcegull-monitors = { workspace = true }
sourcegull-insights = { workspace = true }
sourcegull-own = { workspace = true, features = ["jobs"] }
sourcegull-codehost = { workspace = true }
sourcegull-config = { workspace = true }
sourcegull-crypto = { workspace = true }
sourcegull-db = { workspace = true }
sourcegull-declarative = { workspace = true }
sourcegull-executor = { workspace = true }
sourcegull-feature = { workspace = true }
sourcegull-gitstore = { workspace = true }
