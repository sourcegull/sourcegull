[package]
name = "sourcegull"
description = "The Sourcegull server binary: one executable with roles (web, repo, worker, blob)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[[bin]]
name = "sourcegull"
path = "src/main.rs"

# Without the test harness: the environment is changed before any other thread starts.
[[test]]
name = "inline_keys"
harness = false

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
sourcegull-analytics = { workspace = true }
sourcegull-pubsub = { workspace = true }
sourcegull-authn = { workspace = true }
