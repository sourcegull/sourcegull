[package]
name = "sourcegull-repos"
description = "Host-agnostic repo plumbing: code host registry, discovery sync and webhook ingestion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
sourcegull-feature = { workspace = true }
anyhow = { workspace = true }
sourcegull-codehost = { workspace = true }
sourcegull-codehost-gitlab = { workspace = true }
sourcegull-codehost-github = { workspace = true }
sourcegull-codehost-gitea = { workspace = true }
sourcegull-config = { workspace = true }
sourcegull-crypto = { workspace = true }
sourcegull-db = { workspace = true }
sourcegull-pgqueue = { workspace = true }
sourcegull-types = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
sourcegull-codehost-gitlab = { workspace = true, features = ["testing"] }
sourcegull-codehost-github = { workspace = true, features = ["testing"] }
sourcegull-codehost-gitea = { workspace = true, features = ["testing"] }
sourcegull-testutil = { workspace = true }
wiremock = { workspace = true }
