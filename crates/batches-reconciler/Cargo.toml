[package]
name = "sourcegull-batches-reconciler"
description = "The batch changes reconciler: the changeset planner, the executor of its operations on the code host and repo nodes, the reconciler queue worker and the changeset syncer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
sourcegull-feature = { workspace = true }
anyhow = { workspace = true }
sourcegull-codehost = { workspace = true }
sourcegull-config = { workspace = true }
sourcegull-crypto = { workspace = true }
sourcegull-db = { workspace = true }
sourcegull-services = { workspace = true }
sourcegull-outbound-webhooks = { workspace = true }
sourcegull-pgqueue = { workspace = true }
sourcegull-repos = { workspace = true }
sourcegull-rpc = { workspace = true }
sourcegull-types = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
metrics = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
sourcegull-batches = { workspace = true, features = ["store"] }

[dev-dependencies]
http = { workspace = true }
sourcegull-testutil = { workspace = true, features = ["git"] }
tempfile = "3"
