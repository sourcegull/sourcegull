[package]
name = "sourcegull-executor"
description = "The executor: dequeues jobs from the web role and runs them in containers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
sourcegull-batches = { workspace = true }
sourcegull-batches-steps = { workspace = true }
sourcegull-executor-api = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bollard = "0.19"
base64 = { workspace = true }
bytes = "1"
chrono = { workspace = true }
futures = { workspace = true }
k8s-openapi = { version = "0.28", default-features = false, features = ["std", "v1_32"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tar = "0.4"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The bulk change tables, for tests that check what the server stored.
sourcegull-batches = { workspace = true, features = ["store"] }
tempfile = "3"
async-graphql = { workspace = true }
sourcegull = { workspace = true }
sourcegull-graphql = { workspace = true }
sourcegull-pgqueue = { workspace = true }
sourcegull-types = { workspace = true }
sourcegull-authn = { workspace = true }
sourcegull-blobstore = { workspace = true }
sourcegull-config = { workspace = true }
sourcegull-crypto = { workspace = true }
sourcegull-db = { workspace = true }
sourcegull-http-api = { workspace = true }
sourcegull-services = { workspace = true }
sourcegull-observability = { workspace = true }
sourcegull-testutil = { workspace = true, features = ["git"] }
sourcegull-codeintel-scip = { workspace = true }
