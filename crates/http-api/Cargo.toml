sourcegull-codehost-gitlab = { workspace = true, features = ["testing"] }
sourcegull-testutil = { workspace = true, features = ["git"] }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
sqlx = { workspace = true }
