[package]
name = "sourcegull-http-api"
description = "HTTP server plumbing: routing, middleware, health/metrics endpoints, UI serving and the HTTP APIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
sourcegull-analytics = { workspace = true }
sourcegull-authn = { workspace = true }
sourcegull-batches = { workspace = true, features = ["store"] }
sourcegull-blobstore = { workspace = true }
sourcegull-codehost = { workspace = true }
sourcegull-compute = { workspace = true }
sourcegull-codehost-gitea = { workspace = true }
sourcegull-codehost-github = { workspace = true }
sourcegull-codehost-gitlab = { workspace = true }
sourcegull-config = { workspace = true }
sourcegull-crypto = { workspace = true }
sourcegull-db = { workspace = true }
sourcegull-executor-api = { workspace = true }
sourcegull-pgqueue = { workspace = true }
sourcegull-repos = { workspace = true }
sourcegull-rpc = { workspace = true }
sourcegull-search = { workspace = true }
sourcegull-search-web = { workspace = true }
sourcegull-services = { workspace = true }
sourcegull-http-extract = { workspace = true }
sourcegull-types = { workspace = true }
sourcegull-web-assets = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["set-header"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
bytes = "1"
flate2 = "1"
subtle = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
mime_guess = { workspace = true }
percent-encoding = "2"
url = { workspace = true }
ipnet = "2"
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
sourcegull-codeintel-scip = { workspace = true }

[dev-dependencies]
sourcegull-batches-steps = { workspace = true }
sourcegull-observability = { workspace = true }
sourcegull-own = { workspace = true, features = ["store"] }
anyhow = { workspace = true }
clap = { workspace = true }
sourcegull-cli = { workspace = true }
sourcegull-pgqueue = { workspace = true }
tempfile = "3"
reqwest = { workspace = true }
