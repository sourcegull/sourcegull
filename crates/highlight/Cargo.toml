[package]
name = "sourcegull-highlight"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["syntect"]
## Fall back to syntect (Sublime grammars) for languages without a tree-sitter grammar.
syntect = ["dep:syntect"]

[dependencies]
sourcegull-languages = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-bash = "0.25"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
