[package]
name = "sourcegull-repo-node"
description = "The `repo` role: a repo node serving git storage and keeping its partition of repositories cloned, current and indexed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sourcegull-codehost = { workspace = true }
sourcegull-config = { workspace = true }
sourcegull-crypto = { workspace = true }
sourcegull-db = { workspace = true }
sourcegull-gitstore = { workspace = true }
sourcegull-pgqueue = { workspace = true }
sourcegull-repos = { workspace = true }
sourcegull-rpc = { workspace = true }
sourcegull-search-exec = { workspace = true }
sourcegull-types = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
metrics = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
sourcegull-ranking = { workspace = true }

[dev-dependencies]
sourcegull-codehost-gitlab = { workspace = true, features = ["testing"] }
sourcegull-testutil = { workspace = true }
serde_json = { workspace = true }
