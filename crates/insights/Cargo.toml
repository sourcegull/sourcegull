[package]
name = "sourcegull-insights"
description = "Code Insights, the engine: series definitions, incremental backfill and event-driven recording on pgqueue, per-repository and pre-summed points, and the permission-filtered read path."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sourcegull-feature = { workspace = true }
anyhow = { workspace = true }
sourcegull-pubsub = { workspace = true }
sourcegull-authn = { workspace = true }
sourcegull-authz = { workspace = true }
sourcegull-compute = { workspace = true }
sourcegull-config = { workspace = true }
sourcegull-db = { workspace = true }
axum = { workspace = true }
sourcegull-http-extract = { workspace = true }
sourcegull-search-web = { workspace = true }
sourcegull-services = { workspace = true }
sourcegull-pgqueue = { workspace = true }
sourcegull-query = { workspace = true }
sourcegull-rpc = { workspace = true }
sourcegull-search = { workspace = true }
sourcegull-search-client = { workspace = true }
sourcegull-search-exec = { workspace = true }
sourcegull-types = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
crc32fast = "1"
metrics = { workspace = true }
regex = { workspace = true }
roaring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
gix = { version = "0.89", default-features = false, features = ["sha1"] }
proptest = "1"
tokio = { workspace = true, features = ["test-util"] }
sourcegull-gitstore = { workspace = true }
sourcegull-testutil = { workspace = true, features = ["git"] }
tempfile = "3"
