sourcegull-repos = { workspace = true }
sourcegull-search = { workspace = true }
sourcegull-types = { workspace = true }
metrics = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
sourcegull-codehost-gitlab = { workspace = true, features = ["testing"] }
sourcegull-testutil = { workspace = true }
