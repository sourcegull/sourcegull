# Sourcegull on Docker Compose: PostgreSQL and one container running every role.
#
#   cd sourcegull-compose           # the release bundle; deploy/docker in a checkout
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
#   docker compose up -d
#   open http://localhost:7080      # the first user to sign up becomes site admin
#
# Every SOURCEGULL_* variable in .env reaches the server (docs/configuration.md); .env.example
# lists the common ones. The encryption key file is created on first start at
# /var/opt/sourcegull/keys in the sourcegull-data volume: back it up (docs/install.md).
# Executors, S3 blob storage, monitoring and the production layout (compose.production.yaml,
# one service per role): docs/install.md. Upgrades: upgrade.md.

name: sourcegull

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: sourcegull
      POSTGRES_DB: sourcegull
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    # Size shared_buffers to ~25% of the host's RAM.
    command: >-
      postgres -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      -c work_mem=16MB -c maintenance_work_mem=256MB -c max_connections=200
      -c random_page_cost=1.1 -c shared_preload_libraries=pg_stat_statements
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcegull -d sourcegull -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # `supervise`: creates the key file if missing, applies migrations, runs every role.
  sourcegull:
    image: ${SOURCEGULL_IMAGE:-ghcr.io/sourcegull/sourcegull}:${SOURCEGULL_VERSION:-0.3.0}
    restart: unless-stopped
    command: ["supervise"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
      # The variables configuration files reference with ${env:NAME}.
      - path: ./config/secrets.env
        required: false
    environment:
      SOURCEGULL_DATABASE_URL: ${SOURCEGULL_DATABASE_URL:-postgres://sourcegull:${POSTGRES_PASSWORD}@postgres:5432/sourcegull?sslmode=disable}
      SOURCEGULL_EXTERNAL_URL: ${SOURCEGULL_EXTERNAL_URL:-http://localhost:7080}
      SOURCEGULL_LOG_FORMAT: ${SOURCEGULL_LOG_FORMAT:-json}
    ports:
      - "${SOURCEGULL_HTTP_PORT:-7080}:7080"
    volumes:
      - sourcegull-data:/var/opt/sourcegull
      - ./config:/etc/sourcegull/config:ro
    # The image has no curl: GET /readyz on the internal listener with bash's /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6060 &&
          printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  sourcegull-data:
