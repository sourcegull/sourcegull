# A MinIO next to compose.yaml for S3 blob storage (SCIP uploads, code graph files, search job
# results) instead of the sourcegull-data volume.
#
#   docker compose -f compose.yaml -f compose.minio.yaml up -d
#
# The upstream MinIO images are no longer published; this is the community build of the same
# server. Set MINIO_ROOT_PASSWORD in .env, and:
#   SOURCEGULL_BLOB_STORE=s3://sourcegull
#   SOURCEGULL_S3_ENDPOINT=http://minio:9000
#   SOURCEGULL_S3_PATH_STYLE=true
#   SOURCEGULL_S3_CREATE_BUCKET=true
#   SOURCEGULL_S3_ACCESS_KEY_ID=<MINIO_ROOT_USER or an access key from the console on 127.0.0.1:9001>
#   SOURCEGULL_S3_SECRET_ACCESS_KEY=<its secret>

services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sourcegull}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  sourcegull:
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
