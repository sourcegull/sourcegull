# Example Prometheus config for Sourcegull on Docker Compose (docs/observability/README.md):
# scrapes /metrics on the internal listener (:6060) and loads Sourcegull's alerting rules.
# Targets resolve on the Compose network; from elsewhere, publish :6060 as that page shows.
# The dashboards and alerts select by the `role` label.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Sourcegull's alerting rules, generated from crates/monitoring (docs/observability/alerts.md).
# Point `alerting.alertmanagers` at an Alertmanager to get notified.
rule_files:
  - /etc/prometheus/sourcegull-alerts.yml

scrape_configs:
  # compose.yaml: one process runs every role.
  - job_name: sourcegull
    static_configs:
      - targets: ["sourcegull:6060"]
        labels:
          role: all

  # compose.production.yaml: one service per role (remove the job above). Add a target per
  # extra repo node (repo-1, …).
