          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#repo_repo_moves_failed"
      - alert: sourcegull_repo_instance_up
        expr: |-
          (up{role="repo"})
            < 1
        for: 5m
        labels:
          severity: critical
          service: repo
          owner: platform
          sourcegull_alert: "repo_instance_up"
        annotations:
          summary: "repo: instances answering Prometheus scrapes below 1 for 5m (critical)"
          description: "repo: instances answering Prometheus scrapes below 1 for 5m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#repo_instance_up"
  - name: sourcegull-worker
