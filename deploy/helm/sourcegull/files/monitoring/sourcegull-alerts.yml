          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#repo_disk_free_ratio"
      - alert: sourcegull_repo_repo_update_error_ratio
        expr: |-
          ((sum by (kind) (rate(sourcegull_repo_updates_total{role="repo",outcome="error"}[30m])) or 0 * sum by (kind) (rate(sourcegull_repo_updates_total{role="repo"}[30m])))
           / sum by (kind) (rate(sourcegull_repo_updates_total{role="repo"}[30m])))
            > 0.2
        for: 30m
        labels:
          severity: warning
          service: repo
          owner: source
          sourcegull_alert: "repo_repo_update_error_ratio"
        annotations:
          summary: "repo: share of clones and fetches failing above 20% for 30m (warning)"
          description: "repo: share of clones and fetches failing above 20% for 30m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#repo_repo_update_error_ratio"
      - alert: sourcegull_repo_repo_update_error_ratio
        expr: |-
          ((sum by (kind) (rate(sourcegull_repo_updates_total{role="repo",outcome="error"}[30m])) or 0 * sum by (kind) (rate(sourcegull_repo_updates_total{role="repo"}[30m])))
           / sum by (kind) (rate(sourcegull_repo_updates_total{role="repo"}[30m])))
            > 0.8
        for: 30m
        labels:
          severity: critical
          service: repo
          owner: source
          sourcegull_alert: "repo_repo_update_error_ratio"
        annotations:
          summary: "repo: share of clones and fetches failing above 80% for 30m (critical)"
          description: "repo: share of clones and fetches failing above 80% for 30m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#repo_repo_update_error_ratio"
      - alert: sourcegull_repo_update_queue_oldest
        expr: |-
          (max(sourcegull_queue_oldest_queued_seconds{queue="repo_update_jobs"}))
            > 7200
        for: 30m
        labels:
          severity: warning
          service: repo
          owner: source
          sourcegull_alert: "repo_update_queue_oldest"
        annotations:
          summary: "repo: age of the oldest queued clone or fetch above 2h for 30m (warning)"
          description: "repo: age of the oldest queued clone or fetch above 2h for 30m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#repo_update_queue_oldest"
      - alert: sourcegull_repo_repos_corrupted
        expr: |-
          (max(sourcegull_repos_corrupted))
            > 0
        for: 5m
        labels:
          severity: warning
          service: repo
          owner: source
          sourcegull_alert: "repo_repos_corrupted"
        annotations:
          summary: "repo: repositories marked corrupt above 0 for 5m (warning)"
          description: "repo: repositories marked corrupt above 0 for 5m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#repo_repos_corrupted"
      - alert: sourcegull_repo_index_queue_length
        expr: |-
          (max by (instance) (sourcegull_index_queue_length{role="repo"}))
            > 500
        for: 60m
        labels:
          severity: warning
          service: repo
          owner: search
          sourcegull_alert: "repo_index_queue_length"
        annotations:
          summary: "repo: repositories waiting to be indexed above 500 for 1h (warning)"
          description: "repo: repositories waiting to be indexed above 500 for 1h. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#repo_index_queue_length"
      - alert: sourcegull_repo_index_error_ratio
        expr: |-
          ((sum(rate(sourcegull_index_updates_total{role="repo",outcome="error"}[30m])) or 0 * sum(rate(sourcegull_index_updates_total{role="repo"}[30m])))
           / sum(rate(sourcegull_index_updates_total{role="repo"}[30m])))
            > 0.2
        for: 30m
        labels:
          severity: warning
          service: repo
          owner: search
          sourcegull_alert: "repo_index_error_ratio"
        annotations:
          summary: "repo: share of index builds failing above 20% for 30m (warning)"
          description: "repo: share of index builds failing above 20% for 30m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#repo_index_error_ratio"
      - alert: sourcegull_repo_repo_moves_failed
        expr: |-
