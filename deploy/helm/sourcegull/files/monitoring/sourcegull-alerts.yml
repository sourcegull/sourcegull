          sourcegull_alert: "blob_error_ratio"
        annotations:
          summary: "blob: share of blob requests answered with 5xx above 10% for 10m (critical)"
          description: "blob: share of blob requests answered with 5xx above 10% for 10m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#blob_error_ratio"
      - alert: sourcegull_blob_instance_up
        expr: |-
          (up{role="blob"})
            < 1
        for: 5m
        labels:
          severity: critical
          service: blob
          owner: platform
          sourcegull_alert: "blob_instance_up"
        annotations:
          summary: "blob: instances answering Prometheus scrapes below 1 for 5m (critical)"
          description: "blob: instances answering Prometheus scrapes below 1 for 5m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#blob_instance_up"
  - name: sourcegull-postgres
    rules:
      - alert: sourcegull_postgres_postgres_up
        expr: |-
          (max(sourcegull_postgres_up))
            < 1
        for: 5m
        labels:
          severity: critical
          service: postgres
          owner: platform
          sourcegull_alert: "postgres_postgres_up"
        annotations:
          summary: "postgres: workers reaching Postgres below 1 for 5m (critical)"
          description: "postgres: workers reaching Postgres below 1 for 5m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#postgres_postgres_up"
      - alert: sourcegull_postgres_connection_saturation
        expr: |-
          (sum(max by (state) (sourcegull_postgres_connections))
           / max(sourcegull_postgres_max_connections))
            > 0.8
        for: 5m
        labels:
          severity: warning
          service: postgres
          owner: platform
          sourcegull_alert: "postgres_connection_saturation"
        annotations:
          summary: "postgres: share of max_connections in use by Sourcegull's database above 80% for 5m (warning)"
          description: "postgres: share of max_connections in use by Sourcegull's database above 80% for 5m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#postgres_connection_saturation"
      - alert: sourcegull_postgres_connection_saturation
        expr: |-
          (sum(max by (state) (sourcegull_postgres_connections))
           / max(sourcegull_postgres_max_connections))
            > 0.95
        for: 5m
        labels:
          severity: critical
          service: postgres
          owner: platform
          sourcegull_alert: "postgres_connection_saturation"
        annotations:
          summary: "postgres: share of max_connections in use by Sourcegull's database above 95% for 5m (critical)"
          description: "postgres: share of max_connections in use by Sourcegull's database above 95% for 5m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#postgres_connection_saturation"
      - alert: sourcegull_postgres_oldest_transaction
        expr: |-
          (max(sourcegull_postgres_oldest_transaction_seconds))
            > 1800
        for: 5m
        labels:
          severity: warning
          service: postgres
          owner: platform
          sourcegull_alert: "postgres_oldest_transaction"
        annotations:
          summary: "postgres: age of the oldest open transaction above 30m for 5m (warning)"
          description: "postgres: age of the oldest open transaction above 30m for 5m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#postgres_oldest_transaction"
      - alert: sourcegull_postgres_pool_saturation
        expr: |-
          (max by (role, instance, pool) (sourcegull_db_pool_connections{state="in_use"} / ignoring(state) sourcegull_db_pool_connections{state="max"}))
            > 0.9
        for: 15m
        labels:
          severity: warning
          service: postgres
          owner: platform
          sourcegull_alert: "postgres_pool_saturation"
        annotations:
          summary: "postgres: share of the connection pool in use by process above 90% for 15m (warning)"
          description: "postgres: share of the connection pool in use by process above 90% for 15m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#postgres_pool_saturation"
