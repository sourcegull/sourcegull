# Generated by `sourcegull monitoring generate` from crates/monitoring. Do not edit; change the definitions and regenerate.
# Alert docs: https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md
groups:
  - name: sourcegull-web
    rules:
      - alert: sourcegull_web_http_5xx_ratio
        expr: |-
          ((sum(rate(sourcegull_http_requests_total{role="web",route!~"/metrics|/healthz|/readyz",status=~"5.."}[5m])) or 0 * sum(rate(sourcegull_http_requests_total{role="web",route!~"/metrics|/healthz|/readyz"}[5m])))
           / sum(rate(sourcegull_http_requests_total{role="web",route!~"/metrics|/healthz|/readyz"}[5m])))
            > 0.02
        for: 5m
        labels:
          severity: warning
          service: web
          owner: platform
          sourcegull_alert: "web_http_5xx_ratio"
        annotations:
          summary: "web: share of requests answered with 5xx above 2% for 5m (warning)"
          description: "web: share of requests answered with 5xx above 2% for 5m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#web_http_5xx_ratio"
      - alert: sourcegull_web_http_5xx_ratio
        expr: |-
          ((sum(rate(sourcegull_http_requests_total{role="web",route!~"/metrics|/healthz|/readyz",status=~"5.."}[5m])) or 0 * sum(rate(sourcegull_http_requests_total{role="web",route!~"/metrics|/healthz|/readyz"}[5m])))
           / sum(rate(sourcegull_http_requests_total{role="web",route!~"/metrics|/healthz|/readyz"}[5m])))
            > 0.1
        for: 10m
        labels:
          severity: critical
          service: web
          owner: platform
          sourcegull_alert: "web_http_5xx_ratio"
        annotations:
          summary: "web: share of requests answered with 5xx above 10% for 10m (critical)"
          description: "web: share of requests answered with 5xx above 10% for 10m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#web_http_5xx_ratio"
      - alert: sourcegull_web_http_p90_latency
        expr: |-
          (histogram_quantile(0.9, sum by (le, route) (rate(sourcegull_http_request_duration_seconds_bucket{role="web",route!~"/metrics|/healthz|/readyz|/.api/search/stream|/.api/compute/stream|/.api/blame/.*|/.api/scip/upload|/.api/files/.*|/.executors/.*"}[5m]))))
            > 5
        for: 15m
        labels:
          severity: warning
          service: web
          owner: platform
          sourcegull_alert: "web_http_p90_latency"
        annotations:
          summary: "web: 90th percentile request duration by route above 5s for 15m (warning)"
          description: "web: 90th percentile request duration by route above 5s for 15m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#web_http_p90_latency"
      - alert: sourcegull_web_search_stream_p90_duration
        expr: |-
          (histogram_quantile(0.9, sum by (le) (rate(sourcegull_http_request_duration_seconds_bucket{role="web",route="/.api/search/stream"}[5m]))))
            > 20
        for: 15m
        labels:
          severity: warning
          service: web
          owner: search
          sourcegull_alert: "web_search_stream_p90_duration"
        annotations:
          summary: "web: 90th percentile streaming search duration above 20s for 15m (warning)"
          description: "web: 90th percentile streaming search duration above 20s for 15m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#web_search_stream_p90_duration"
      - alert: sourcegull_web_graphql_p90_duration
        expr: |-
          (histogram_quantile(0.9, sum by (le) (rate(sourcegull_http_request_duration_seconds_bucket{role="web",route="/.api/graphql"}[5m]))))
            > 5
        for: 15m
        labels:
          severity: warning
          service: web
          owner: platform
          sourcegull_alert: "web_graphql_p90_duration"
        annotations:
          summary: "web: 90th percentile GraphQL request duration above 5s for 15m (warning)"
          description: "web: 90th percentile GraphQL request duration above 5s for 15m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#web_graphql_p90_duration"
      - alert: sourcegull_web_webhook_rejection_ratio
        expr: |-
          ((sum(rate(sourcegull_http_requests_total{role="web",route=~"/.api/gitlab-webhooks|/.api/webhooks/.*",status!~"2.."}[30m])) or 0 * sum(rate(sourcegull_http_requests_total{role="web",route=~"/.api/gitlab-webhooks|/.api/webhooks/.*"}[30m])))
           / sum(rate(sourcegull_http_requests_total{role="web",route=~"/.api/gitlab-webhooks|/.api/webhooks/.*"}[30m])))
            > 0.5
        for: 30m
        labels:
          severity: warning
          service: web
          owner: source
          sourcegull_alert: "web_webhook_rejection_ratio"
        annotations:
          summary: "web: share of code host webhooks rejected above 50% for 30m (warning)"
          description: "web: share of code host webhooks rejected above 50% for 30m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#web_webhook_rejection_ratio"
      - alert: sourcegull_web_instance_up
        expr: |-
          (up{role="web"})
            < 1
        for: 5m
        labels:
          severity: critical
          service: web
          owner: platform
          sourcegull_alert: "web_instance_up"
        annotations:
          summary: "web: instances answering Prometheus scrapes below 1 for 5m (critical)"
          description: "web: instances answering Prometheus scrapes below 1 for 5m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#web_instance_up"
  - name: sourcegull-repo
    rules:
      - alert: sourcegull_repo_disk_free_ratio
        expr: |-
          (min by (instance) (sourcegull_repo_disk_free_bytes{role="repo"} / sourcegull_repo_disk_total_bytes{role="repo"}))
            < 0.15
        for: 10m
        labels:
          severity: warning
          service: repo
          owner: source
          sourcegull_alert: "repo_disk_free_ratio"
        annotations:
          summary: "repo: free disk space on the data volume below 15% for 10m (warning)"
          description: "repo: free disk space on the data volume below 15% for 10m. Current value: {{ $value }}. See the runbook for next steps."
          runbook_url: "https://github.com/sourcegull/sourcegull/blob/main/docs/observability/alerts.md#repo_disk_free_ratio"
      - alert: sourcegull_repo_disk_free_ratio
        expr: |-
          (min by (instance) (sourcegull_repo_disk_free_bytes{role="repo"} / sourcegull_repo_disk_total_bytes{role="repo"}))
            < 0.05
        for: 5m
        labels:
          severity: critical
          service: repo
          owner: source
          sourcegull_alert: "repo_disk_free_ratio"
