{{- /* The configuration files rendered from config.*, unless config.existingSecret is set. */ -}}
{{- if and (not .Values.config.existingSecret) (include "sourcegull.configEnabled" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sourcegull.configSecretName" . }}
  labels:
    {{- include "sourcegull.componentLabels" (dict "root" . "component" "config") | nindent 4 }}
  {{- with (include "sourcegull.annotations" (dict "root" $) | trim) }}{{ . | nindent 2 }}{{ end }}
type: Opaque
data:
  {{- with .Values.config.siteConfig }}
  site-config.json: {{ toPrettyJson . | b64enc }}
  {{- end }}
  {{- with .Values.config.globalSettings }}
  global-settings.json: {{ toPrettyJson . | b64enc }}
  {{- end }}
  {{- with .Values.config.resources }}
  resources.json: {{ toPrettyJson . | b64enc }}
  {{- end }}
{{- end }}
