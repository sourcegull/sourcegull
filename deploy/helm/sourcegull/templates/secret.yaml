{{- /* Generated application secret, only when no existingSecret is given. */ -}}
{{- if not .Values.existingSecret }}
{{- $name := include "sourcegull.appSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sourcegull.componentLabels" (dict "root" . "component" "secrets") | nindent 4 }}
  {{- /* Losing the encryption keys makes encrypted data unreadable: keep the Secret on uninstall. */}}
  {{- with (include "sourcegull.annotations" (dict "root" . "extra" (dict "helm.sh/resource-policy" "keep")) | trim) }}{{ . | nindent 2 }}{{ end }}
type: Opaque
data:
  {{- if ne .Values.encryptionKeys.source "external" }}
  encryption-keys: {{ include "sourcegull.secretValue" (dict "root" . "name" $name "key" "encryption-keys" "generate" (printf "k1:%s\n" (randBytes 32))) }}
  {{- end }}
  {{- if and .Values.executor.enabled (not .Values.executor.existingSecret) }}
  # The shared executor token; set site config `executors.accessToken` to it.
  {{ .Values.executor.existingSecretTokenKey }}: {{ include "sourcegull.secretValue" (dict "root" . "name" $name "key" .Values.executor.existingSecretTokenKey "generate" (randAlphaNum 40)) }}
  {{- end }}
{{- end }}
