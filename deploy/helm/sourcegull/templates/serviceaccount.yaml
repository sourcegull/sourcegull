{{- include "sourcegull.validate" . -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sourcegull.serviceAccountName" . }}
  labels:
    {{- include "sourcegull.labels" . | nindent 4 }}
  {{- with (include "sourcegull.annotations" (dict "root" . "extra" .Values.serviceAccount.annotations) | trim) }}{{ . | nindent 2 }}{{ end }}
# Pods set their own: only worker pods mount the token (leader election on Lease objects, leader-rbac.yaml).
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
